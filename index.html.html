<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Multiplicación: Batalla de Equipos</title>
    <!-- Tailwind CSS CDN para estilos rápidos y responsivos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Fredoka de Google Fonts para un estilo Game Show Infantil -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #2b1055 0%, #591a73 50%, #110e30 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Sombras y bordes tipo Game Show */
        .game-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .btn-action {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.3), 0 15px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-action:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 rgba(0, 0, 0, 0.3), 0 20px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-action:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3), 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        /* Resaltado del equipo activo */
        .team-active {
            transform: scale(1.08);
            border-color: #facc15 !important;
            box-shadow: 0 0 25px #facc15, inset 0 0 15px #facc15;
            animation: pulse-border 1.5s infinite alternate;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 15px #facc15, inset 0 0 10px #facc15; }
            100% { box-shadow: 0 0 30px #facc15, inset 0 0 20px #facc15; }
        }

        /* Animaciones para feedback */
        .bounce-correct {
            animation: bounce 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        .shake-incorrect {
            animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-30px) scale(1.1); }
            60% { transform: translateY(-15px) scale(1.05); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        canvas#confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen p-4 sm:p-6 relative">

    <!-- Canvas para efectos de confetti -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Barra de Controles Superiores (Sonido y Pantalla Completa) -->
    <header class="flex justify-between items-center w-full max-w-7xl mx-auto z-10 mb-4">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🚀</span>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-wider text-yellow-300 drop-shadow-md">
                MISIÓN MULTIPLICACIÓN
            </h1>
        </div>
        <div class="flex space-x-3">
            <button id="btn-sound" onclick="toggleSound()" class="btn-action bg-purple-600 hover:bg-purple-500 text-white p-3 rounded-2xl flex items-center justify-center text-xl" title="Activar/Desactivar Sonido">
                🔊
            </button>
            <button id="btn-fullscreen" onclick="toggleFullscreen()" class="btn-action bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-2xl flex items-center justify-center text-xl" title="Pantalla Completa">
                ⛶
            </button>
        </div>
    </header>

    <!-- PANTALLA 1: CONFIGURACIÓN INICIAL -->
    <main id="screen-config" class="w-full max-w-4xl mx-auto game-card rounded-3xl p-6 sm:p-10 z-10 my-auto">
        <h2 class="text-3xl sm:text-4xl font-extrabold text-center text-yellow-400 mb-8 uppercase tracking-wide drop-shadow-lg">
            ⚡ Configuración de la Batalla ⚡
        </h2>

        <!-- Selección de número de equipos -->
        <div class="mb-8">
            <label class="block text-xl sm:text-2xl font-semibold mb-3 text-cyan-300 text-center sm:text-left">
                1. ¿Cuántos equipos jugarán?
            </label>
            <div class="flex justify-center sm:justify-start space-x-3 sm:space-x-4">
                <button onclick="setTeamCount(2)" class="btn-team-count btn-action px-6 py-3 rounded-2xl text-2xl font-bold bg-cyan-600 border-2 border-cyan-300" data-count="2">2</button>
                <button onclick="setTeamCount(3)" class="btn-team-count btn-action px-6 py-3 rounded-2xl text-2xl font-bold bg-purple-800 border-2 border-transparent" data-count="3">3</button>
                <button onclick="setTeamCount(4)" class="btn-team-count btn-action px-6 py-3 rounded-2xl text-2xl font-bold bg-purple-800 border-2 border-transparent" data-count="4">4</button>
                <button onclick="setTeamCount(5)" class="btn-team-count btn-action px-6 py-3 rounded-2xl text-2xl font-bold bg-purple-800 border-2 border-transparent" data-count="5">5</button>
            </div>
        </div>

        <!-- Nombres y colores de equipos -->
        <div class="mb-8">
            <label class="block text-xl sm:text-2xl font-semibold mb-3 text-cyan-300 text-center sm:text-left">
                2. Personalizar Equipos:
            </label>
            <div id="teams-input-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Se genera dinámicamente con JS -->
            </div>
        </div>

        <!-- Selección de total de preguntas -->
        <div class="mb-8">
            <label class="block text-xl sm:text-2xl font-semibold mb-3 text-cyan-300 text-center sm:text-left">
                3. Total de Preguntas en la Partida:
            </label>
            <div class="flex justify-center sm:justify-start space-x-4">
                <button onclick="setQuestionCount(10)" class="btn-q-count btn-action px-6 py-3 rounded-2xl text-xl font-bold bg-purple-800 border-2 border-transparent" data-q="10">10 Preguntas</button>
                <button onclick="setQuestionCount(20)" class="btn-q-count btn-action px-6 py-3 rounded-2xl text-xl font-bold bg-emerald-600 border-2 border-emerald-300" data-q="20">20 Preguntas</button>
                <button onclick="setQuestionCount(30)" class="btn-q-count btn-action px-6 py-3 rounded-2xl text-xl font-bold bg-purple-800 border-2 border-transparent" data-q="30">30 Preguntas</button>
            </div>
        </div>

        <!-- Botón para iniciar -->
        <div class="text-center pt-4">
            <button onclick="startGame()" class="btn-action bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 text-slate-900 font-extrabold text-3xl sm:text-4xl px-12 py-5 rounded-3xl uppercase tracking-wider w-full sm:w-auto transform hover:scale-105">
                ¡Comenzar Batalla! ⚔️
            </button>
        </div>
    </main>

    <!-- PANTALLA 2: JUEGO PRINCIPAL -->
    <main id="screen-game" class="hidden w-full max-w-6xl mx-auto flex-col space-y-6 z-10 my-auto">
        <!-- Marcador Global de Equipos -->
        <div id="scoreboard" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 w-full">
            <!-- Tarjetas de puntos generadas por JS -->
        </div>

        <!-- Panel de Pregunta Principal -->
        <div class="game-card rounded-3xl p-6 sm:p-10 text-center flex flex-col items-center relative overflow-hidden">
            <!-- Indicador de Progreso y Turno -->
            <div class="flex justify-between items-center w-full mb-4 px-2 text-lg sm:text-xl text-purple-200 font-semibold">
                <span id="question-tracker">Pregunta 1 de 20</span>
                <span id="turn-badge" class="px-4 py-1 rounded-full text-white font-bold transition-all duration-300">
                    Turno: Equipo
                </span>
            </div>

            <!-- Pregunta Gigante -->
            <div class="my-4 sm:my-8">
                <span class="text-2xl sm:text-3xl text-yellow-300 block mb-2 font-medium">¿Cuánto es?</span>
                <h3 id="question-text" class="text-6xl sm:text-8xl md:text-9xl font-black text-white tracking-widest drop-shadow-2xl">
                    7 × 8
                </h3>
            </div>

            <!-- 4 Opciones de Respuesta en Gran Tamaño -->
            <div id="options-container" class="grid grid-cols-2 gap-4 sm:gap-6 w-full max-w-4xl mt-4">
                <!-- Botones de opciones insertados por JS -->
            </div>

            <!-- Feedback / Mensaje de Estado -->
            <div id="feedback-area" class="h-16 flex items-center justify-center mt-4">
                <p id="feedback-text" class="text-2xl sm:text-3xl font-extrabold"></p>
            </div>
        </div>

        <!-- Botón para avanzar a la siguiente pregunta -->
        <div class="flex justify-end">
            <button id="btn-next" onclick="nextQuestion()" class="hidden btn-action bg-gradient-to-r from-emerald-400 to-teal-600 text-slate-900 font-extrabold text-2xl sm:text-3xl px-8 py-4 rounded-2xl items-center space-x-3">
                <span>Siguiente Pregunta</span>
                <span>➡️</span>
            </button>
        </div>
    </main>

    <!-- PANTALLA 3: PODIO / RESULTADOS FINALES -->
    <main id="screen-results" class="hidden w-full max-w-4xl mx-auto game-card rounded-3xl p-6 sm:p-10 text-center z-10 my-auto">
        <h2 class="text-4xl sm:text-6xl font-black text-yellow-400 mb-2 uppercase drop-shadow-lg">
            🏆 ¡FIN DE LA BATALLA! 🏆
        </h2>
        <p id="winner-announcement" class="text-2xl sm:text-4xl font-bold text-cyan-300 mb-8">
            ¡El equipo X es el Ganador!
        </p>

        <!-- Tabla de Posiciones / Podio -->
        <div id="leaderboard" class="space-y-4 max-w-2xl mx-auto mb-10">
            <!-- Filas de posiciones generadas por JS -->
        </div>

        <!-- Botón para Reiniciar -->
        <button onclick="resetToConfig()" class="btn-action bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 text-slate-900 font-extrabold text-2xl sm:text-3xl px-10 py-5 rounded-3xl uppercase tracking-wider transform hover:scale-105">
            🎮 Nueva Partida
        </button>
    </main>

    <!-- Footer decorativo -->
    <footer class="text-center text-purple-300/60 text-sm mt-4 z-10">
        Misión Multiplicación • Diseñado para aprendizaje activo en el aula
    </footer>

    <!-- LÓGICA DE JUEGO EN JAVASCRIPT -->
    <script>
        /* ==========================================================================
           1. ESTADO DEL JUEGO Y CONFIGURACIÓN
           ========================================================================== */
        const DEFAULT_COLORS = [
            { name: 'Rojo', bg: 'bg-red-600', hex: '#dc2626', border: 'border-red-400' },
            { name: 'Azul', bg: 'bg-blue-600', hex: '#2563eb', border: 'border-blue-400' },
            { name: 'Verde', bg: 'bg-emerald-600', hex: '#059669', border: 'border-emerald-400' },
            { name: 'Amarillo', bg: 'bg-amber-500', hex: '#d97706', border: 'border-amber-300' },
            { name: 'Morado', bg: 'bg-purple-600', hex: '#9333ea', border: 'border-purple-400' }
        ];

        let state = {
            numTeams: 2,
            totalQuestions: 20,
            currentQuestionIdx: 0,
            currentTeamIdx: 0,
            soundEnabled: true,
            teams: [],
            questionsPool: [],
            currentQuestion: null,
            canAnswer: true
        };

        /* ==========================================================================
           2. SINTETIZADOR DE AUDIO (Web Audio API - Sin archivos externos)
           ========================================================================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!state.soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'correct') {
                // Arpegio victorioso ascendente
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.25);
                });
            } else if (type === 'incorrect') {
                // Tono descendente suave
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'victory') {
                // Fanfarria final
                const notes = [440, 554.37, 659.25, 880, 659.25, 880];
                const durations = [0.15, 0.15, 0.15, 0.3, 0.15, 0.5];
                let timeOffset = 0;

                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + timeOffset);
                    gain.gain.setValueAtTime(0.3, now + timeOffset);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + timeOffset + durations[idx]);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + timeOffset);
                    osc.stop(now + timeOffset + durations[idx]);
                    timeOffset += durations[idx] + 0.03;
                });
            }
        }

        /* ==========================================================================
           3. INICIALIZACIÓN Y CONFIGURACIÓN DE PANTALLAS
           ========================================================================== */
        window.onload = function() {
            renderTeamInputs();
        };

        function setTeamCount(count) {
            playSound('click');
            state.numTeams = count;
            
            // Actualizar estilo botones de conteo
            document.querySelectorAll('.btn-team-count').forEach(btn => {
                if (parseInt(btn.dataset.count) === count) {
                    btn.className = 'btn-team-count btn-action px-6 py-3 rounded-2xl text-2xl font-bold bg-cyan-600 border-2 border-cyan-300';
                } else {
                    btn.className = 'btn-team-count btn-action px-6 py-3 rounded-2xl text-2xl font-bold bg-purple-800 border-2 border-transparent';
                }
            });

            renderTeamInputs();
        }

        function setQuestionCount(count) {
            playSound('click');
            state.totalQuestions = count;
            
            document.querySelectorAll('.btn-q-count').forEach(btn => {
                if (parseInt(btn.dataset.q) === count) {
                    btn.className = 'btn-q-count btn-action px-6 py-3 rounded-2xl text-xl font-bold bg-emerald-600 border-2 border-emerald-300';
                } else {
                    btn.className = 'btn-q-count btn-action px-6 py-3 rounded-2xl text-xl font-bold bg-purple-800 border-2 border-transparent';
                }
            });
        }

        function renderTeamInputs() {
            const container = document.getElementById('teams-input-container');
            container.innerHTML = '';

            for (let i = 0; i < state.numTeams; i++) {
                const colorInfo = DEFAULT_COLORS[i % DEFAULT_COLORS.length];
                const teamDiv = document.createElement('div');
                teamDiv.className = 'flex items-center space-x-3 bg-white/10 p-3 rounded-2xl border border-white/20';
                
                teamDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full ${colorInfo.bg} flex-shrink-0 border-2 border-white"></div>
                    <input type="text" id="team-name-${i}" value="Equipo ${i + 1}" 
                           maxlength="15"
                           class="w-full bg-slate-900/50 text-white font-bold px-4 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-400 text-lg sm:text-xl" />
                `;
                container.appendChild(teamDiv);
            }
        }

        /* ==========================================================================
           4. GENERADOR DE PREGUNTAS Y MATEMÁTICAS
           ========================================================================== */
        function generateQuestionsPool() {
            const pool = [];
            // Generar todas las operaciones posibles del 1 al 10
            for (let a = 1; a <= 10; a++) {
                for (let b = 1; b <= 10; b++) {
                    const num1 = a;
                    const num2 = b;
                    const answer = num1 * num2;
                    
                    // Generar 3 distractores únicos e independientes
                    const optionsSet = new Set([answer]);
                    
                    while (optionsSet.size < 4) {
                        let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                        let wrongAnswer = answer + offset;
                        
                        // Evitar números negativos o cero
                        if (wrongAnswer > 0 && wrongAnswer <= 100 && wrongAnswer !== answer) {
                            optionsSet.add(wrongAnswer);
                        }
                    }

                    // Convertir Set a Array y mezclar opciones
                    const options = Array.from(optionsSet).sort(() => Math.random() - 0.5);

                    pool.push({ num1, num2, answer, options });
                }
            }

            // Mezclar preguntas aleatoriamente
            return pool.sort(() => Math.random() - 0.5);
        }

        /* ==========================================================================
           5. FLUJO DE JUEGO (GAMEPLAY)
           ========================================================================== */
        function startGame() {
            playSound('click');

            // Recopilar nombres de equipos
            state.teams = [];
            for (let i = 0; i < state.numTeams; i++) {
                const nameInput = document.getElementById(`team-name-${i}`);
                const name = nameInput ? nameInput.value.trim() || `Equipo ${i + 1}` : `Equipo ${i + 1}`;
                state.teams.push({
                    id: i,
                    name: name,
                    score: 0,
                    color: DEFAULT_COLORS[i % DEFAULT_COLORS.length]
                });
            }

            state.currentQuestionIdx = 0;
            state.currentTeamIdx = 0;
            state.questionsPool = generateQuestionsPool();

            // Cambiar pantallas
            document.getElementById('screen-config').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.getElementById('screen-game').classList.add('flex');

            renderScoreboard();
            loadQuestion();
        }

        function renderScoreboard() {
            const board = document.getElementById('scoreboard');
            board.innerHTML = '';

            state.teams.forEach((team, idx) => {
                const isCurrent = idx === state.currentTeamIdx;
                const card = document.createElement('div');
                card.id = `score-card-${idx}`;
                card.className = `game-card rounded-2xl p-3 sm:p-4 text-center border-4 transition-all duration-300 ${team.color.bg} ${isCurrent ? 'team-active' : 'opacity-80'}`;
                
                card.innerHTML = `
                    <p class="text-sm sm:text-lg font-bold text-white/90 truncate">${team.name}</p>
                    <p id="team-score-${idx}" class="text-3xl sm:text-5xl font-black text-white drop-shadow">${team.score}</p>
                    <p class="text-xs text-white/70 font-semibold uppercase tracking-wider">Puntos</p>
                `;
                board.appendChild(card);
            });
        }

        function updateScoreboardHighlight() {
            state.teams.forEach((team, idx) => {
                const card = document.getElementById(`score-card-${idx}`);
                if (card) {
                    if (idx === state.currentTeamIdx) {
                        card.classList.add('team-active');
                        card.classList.remove('opacity-80');
                    } else {
                        card.classList.remove('team-active');
                        card.classList.add('opacity-80');
                    }
                }
            });
        }

        function loadQuestion() {
            state.canAnswer = true;
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('feedback-text').textContent = '';

            // Verificar si el banco se agotó, si es así, regenerar
            if (state.questionsPool.length === 0) {
                state.questionsPool = generateQuestionsPool();
            }

            state.currentQuestion = state.questionsPool.pop();
            const currentTeam = state.teams[state.currentTeamIdx];

            // Tracker de Pregunta
            document.getElementById('question-tracker').textContent = `Pregunta ${state.currentQuestionIdx + 1} de ${state.totalQuestions}`;
            
            // Badge del turno actual
            const turnBadge = document.getElementById('turn-badge');
            turnBadge.textContent = `Turno: ${currentTeam.name}`;
            turnBadge.className = `px-5 py-2 rounded-full text-white font-extrabold text-lg sm:text-xl shadow-lg ${currentTeam.color.bg}`;

            // Texto de pregunta
            document.getElementById('question-text').textContent = `${state.currentQuestion.num1} × ${state.currentQuestion.num2}`;

            // Opciones de respuesta
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            state.currentQuestion.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option btn-action bg-gradient-to-b from-indigo-600 to-blue-800 border-4 border-indigo-400/50 hover:border-yellow-300 text-white font-black text-4xl sm:text-6xl py-6 rounded-3xl shadow-2xl transition-all';
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedOption, clickedBtn) {
            if (!state.canAnswer) return;
            state.canAnswer = false;

            const isCorrect = selectedOption === state.currentQuestion.answer;
            const currentTeam = state.teams[state.currentTeamIdx];
            const feedbackText = document.getElementById('feedback-text');

            // Deshabilitar todos los botones de opciones
            const allBtns = document.querySelectorAll('.btn-option');
            allBtns.forEach(btn => {
                btn.onclick = null;
                btn.classList.remove('btn-action');
                if (parseInt(btn.textContent) === state.currentQuestion.answer) {
                    btn.className = 'btn-option bg-emerald-500 border-4 border-emerald-200 text-white font-black text-4xl sm:text-6xl py-6 rounded-3xl shadow-2xl scale-105';
                }
            });

            if (isCorrect) {
                playSound('correct');
                currentTeam.score += 10;
                
                // Actualizar puntuación en vivo
                document.getElementById(`team-score-${state.currentTeamIdx}`).textContent = currentTeam.score;

                clickedBtn.classList.add('bounce-correct');
                feedbackText.textContent = `¡CORRECTO! +10 PUNTOS PARA ${currentTeam.name.toUpperCase()} 🎉`;
                feedbackText.className = 'text-2xl sm:text-3xl font-extrabold text-emerald-400 drop-shadow-lg';
                
                triggerConfetti(0.3);
            } else {
                playSound('incorrect');
                clickedBtn.classList.add('shake-incorrect');
                clickedBtn.className = 'btn-option bg-rose-600 border-4 border-rose-300 text-white font-black text-4xl sm:text-6xl py-6 rounded-3xl opacity-80';

                feedbackText.textContent = `¡INCORRECTO! La respuesta correcta era ${state.currentQuestion.answer}`;
                feedbackText.className = 'text-2xl sm:text-3xl font-extrabold text-rose-400 drop-shadow-lg';
            }

            // Mostrar botón para avanzar
            document.getElementById('btn-next').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('flex');
        }

        function nextQuestion() {
            playSound('click');
            state.currentQuestionIdx++;

            if (state.currentQuestionIdx >= state.totalQuestions) {
                endGame();
            } else {
                // Rotar al siguiente equipo
                state.currentTeamIdx = (state.currentTeamIdx + 1) % state.numTeams;
                updateScoreboardHighlight();
                loadQuestion();
            }
        }

        /* ==========================================================================
           6. PANTALLA FINAL Y CLASIFICACIÓN
           ========================================================================== */
        function endGame() {
            playSound('victory');
            triggerConfetti(2.5);

            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('flex');
            document.getElementById('screen-results').classList.remove('hidden');

            // Ordenar equipos por puntaje descendente
            const sortedTeams = [...state.teams].sort((a, b) => b.score - a.score);
            const topScore = sortedTeams[0].score;
            const winners = sortedTeams.filter(t => t.score === topScore);

            const winnerAnnouncement = document.getElementById('winner-announcement');
            if (winners.length === 1) {
                winnerAnnouncement.textContent = `🏆 ¡FELICIDADES ${winners[0].name.toUpperCase()}! GANADORES DE LA BATALLA 🏆`;
                winnerAnnouncement.className = `text-2xl sm:text-4xl font-bold mb-8 ${winners[0].color.bg} text-white p-4 rounded-2xl shadow-xl`;
            } else {
                const winnerNames = winners.map(w => w.name).join(' & ');
                winnerAnnouncement.textContent = `🤝 ¡EMPATE IMPRESIONANTE ENTRE ${winnerNames.toUpperCase()}! 🤝`;
                winnerAnnouncement.className = 'text-2xl sm:text-4xl font-bold mb-8 bg-amber-500 text-white p-4 rounded-2xl shadow-xl';
            }

            // Mostrar podio / posiciones
            const leaderboard = document.getElementById('leaderboard');
            leaderboard.innerHTML = '';

            sortedTeams.forEach((team, idx) => {
                const row = document.createElement('div');
                let medal = '🏅';
                if (idx === 0) medal = '🥇';
                else if (idx === 1) medal = '🥈';
                else if (idx === 2) medal = '🥉';

                row.className = `flex justify-between items-center ${team.color.bg} p-4 rounded-2xl text-xl sm:text-2xl font-bold border-2 ${team.color.border} shadow-lg`;
                row.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <span class="text-3xl sm:text-4xl">${medal}</span>
                        <span>${team.name}</span>
                    </div>
                    <span class="text-3xl sm:text-4xl font-black">${team.score} PTS</span>
                `;
                leaderboard.appendChild(row);
            });
        }

        function resetToConfig() {
            playSound('click');
            document.getElementById('screen-results').classList.add('hidden');
            document.getElementById('screen-config').classList.remove('hidden');
        }

        /* ==========================================================================
           7. UTILIDADES (Sonido, Pantalla Completa y Confetti Canvas)
           ========================================================================== */
        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            const btn = document.getElementById('btn-sound');
            btn.textContent = state.soundEnabled ? '🔊' : '🔇';
            btn.className = state.soundEnabled 
                ? 'btn-action bg-purple-600 hover:bg-purple-500 text-white p-3 rounded-2xl flex items-center justify-center text-xl' 
                : 'btn-action bg-gray-600 hover:bg-gray-500 text-white p-3 rounded-2xl flex items-center justify-center text-xl';
        }

        function toggleFullscreen() {
            playSound('click');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error al activar pantalla completa: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Sistema de Confeti liviano nativo en Canvas
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti(durationSeconds) {
            const particleCount = 150;
            const colors = ['#facc15', '#38bdf8', '#f43f5e', '#a855f7', '#34d399', '#fb923c'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 6,
                    vy: Math.random() * 4 + 4,
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 10
                });
            }

            let startTime = performance.now();
            function animateConfetti(currentTime) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach((p, idx) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rotation += p.rSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();

                    // Limpiar partículas fuera de pantalla
                    if (p.y > canvas.height) {
                        particles.splice(idx, 1);
                    }
                });

                if (currentTime - startTime < durationSeconds * 1000 || particles.length > 0) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles = [];
                }
            }
            requestAnimationFrame(animateConfetti);
        }
    </script>
</body>
